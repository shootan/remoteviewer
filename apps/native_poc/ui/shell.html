<!doctype html>
<!--
  The connect screen.

  Drawn as a page rather than in Win32 because the alternative is owning every pixel, font and
  DPI case by hand, and the result still looks like 1998. Nothing here touches the video: the
  page decides which PC to open and with what settings, then hands over to a window the C++ side
  draws with D3D11.

  Everything crossing the boundary is JSON with a "type", matching client_shell_bridge.hpp.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GNLink</title>
<style>
  :root {
    --bg: #0f1319;
    --panel: #171c25;
    --panel-hover: #1e2531;
    --line: #262e3b;
    --text: #e8eaed;
    --muted: #98a1b0;
    --accent: #3b82f6;
    --accent-hover: #2f6fd0;
    --online: #3ecf8e;
    --danger: #f2555a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }
  .card {
    width: 380px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 28px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .45);
  }
  .brand { font-size: 22px; font-weight: 600; letter-spacing: -.2px; }
  .brand span { color: var(--accent); }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 6px; }

  label { display: block; font-size: 12px; color: var(--muted); margin: 16px 0 6px; }
  input {
    width: 100%; padding: 10px 12px; font-size: 14px; color: var(--text);
    background: #0d1117; border: 1px solid var(--line); border-radius: 7px; outline: none;
    font-family: inherit;
  }
  input:focus { border-color: var(--accent); }
  /* Keyboard focus had no mark of its own: tabbing through the form moved an invisible caret and
     the buttons showed nothing at all. `:focus-visible` leaves mouse clicks alone, so this only
     appears for the people who need it. A screenshot cannot show this -- it is here because the
     common rules ask for it, and it is listed as unphotographed rather than as evidence. */
  input:focus-visible,
  select:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  button {
    width: 100%; margin-top: 20px; padding: 11px; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--accent); border: 0; border-radius: 7px; cursor: pointer;
    font-family: inherit;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: default; }

  .msg { margin-top: 14px; font-size: 12.5px; min-height: 17px; color: var(--muted); }
  .msg.error { color: var(--danger); }

  /* Host list */
  .head { display: flex; align-items: baseline; justify-content: space-between; }
  .link {
    color: var(--muted); font-size: 12px; cursor: pointer; background: none; border: 0;
    width: auto; margin: 0; padding: 0; font-weight: normal;
  }
  .link:hover { color: var(--text); background: none; }
  .hosts { margin-top: 16px; max-height: 320px; overflow-y: auto; }
  .host {
    display: flex; align-items: center; gap: 11px; width: 100%;
    padding: 13px 14px; margin: 0 0 8px; text-align: left;
    background: #0d1117; border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
  }
  .host:hover:not(:disabled) { background: var(--panel-hover); border-color: #33404f; }
  .host:disabled { cursor: default; opacity: .45; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4b5563; flex: none; }
  .dot.on { background: var(--online); box-shadow: 0 0 8px rgba(62, 207, 142, .55); }
  .host .name { font-size: 14px; font-weight: 500; }
  .host .state { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  /* The card that is connecting says so on itself. The status line under the list was the only
     place it appeared, so the card kept its green dot and "연결 가능" while the connection was
     being made -- not missing information, wrong information. */
  .host[data-connecting="1"] { border-color: var(--accent); opacity: 1; }
  .host[data-connecting="1"] .state { color: var(--accent); }
  .host[data-connecting="1"] .dot { background: var(--accent); box-shadow: none; }
  .empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 26px 0; }

  .row { display: flex; justify-content: space-between; margin-top: 4px; }
  .hint { color: var(--text); font-weight: 600; float: right; }
  .note { color: var(--muted); font-size: 11.5px; margin-top: 7px; line-height: 1.5; }
  .note strong { color: #d8b26a; font-weight: 600; }

  select {
    width: 100%; padding: 10px 12px; font-size: 14px; color: var(--text);
    background: #0d1117; border: 1px solid var(--line); border-radius: 7px; outline: none;
    font-family: inherit;
  }
  input[type=range] {
    -webkit-appearance: none; appearance: none; padding: 0; height: 4px; margin-top: 10px;
    background: var(--line); border: 0; border-radius: 2px; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 17px; height: 17px; border-radius: 50%;
    background: var(--accent); border: 0; cursor: pointer;
  }

  .hidden { display: none; }
  .spinner {
    width: 15px; height: 15px; border: 2px solid rgba(255,255,255,.25);
    border-top-color: #fff; border-radius: 50%; display: inline-block;
    animation: spin .7s linear infinite; vertical-align: -3px; margin-right: 7px;
  }
  /* Fixed to the top rather than placed in a card: the offer belongs to the program, not to the
     screen that happens to be showing, and it has to survive sign-in replacing one card with
     another. */
  #updateBar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px;
    background: #14304f; border-bottom: 1px solid var(--accent);
  }
  /* Wraps as a row of its own rather than squeezing. At 360px the one-line layout gave the text a
     column six characters wide and broke "업데이트" across two lines inside its own button; the
     buttons now drop below the sentence instead. */
  #updateBar .what { flex: 1 1 190px; font-size: 13px; }
  #updateBar button {
    width: auto; margin: 0; padding: 7px 14px; font-size: 13px;
    white-space: nowrap; flex: 0 0 auto;
  }
  #updateLater { background: transparent; border: 1px solid var(--line); color: var(--muted); }
  #updateLater:hover { background: var(--panel-hover); }
  /* `.hidden` is a class (0-0-1-0) and `#updateBar` is an id (0-1-0-0), so the id won and the bar
     was on screen from the first paint -- offer and all -- no matter what the script said. Adding
     the id here makes the hiding rule the more specific of the two. Everything else that hides
     lives in a .card, where a class is enough. */
  #updateBar.hidden { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Hidden until a check finds something. The version is filled in from the message's field, not
     read out of the sentence beside it. -->
<div id="updateBar" class="hidden">
  <div class="what" id="updateText"></div>
  <button id="updateNow">업데이트</button>
  <button id="updateLater">나중에</button>
</div>

<div class="card" id="signInCard">
  <div class="brand">GN<span>Link</span></div>
  <div class="sub">계정으로 로그인하면 등록된 PC가 보입니다.</div>

  <label for="server">서버 주소</label>
  <!-- https, because the update path refuses http at two layers. An http example here is an
       instruction to type the one address that silently turns updates off. -->
  <input id="server" spellcheck="false" placeholder="https://주소">

  <label for="account">아이디</label>
  <input id="account" spellcheck="false" autocomplete="off">

  <label for="password">비밀번호</label>
  <input id="password" type="password" autocomplete="off">

  <button id="signIn">로그인</button>
  <div class="msg" id="signInMsg"></div>
</div>

<div class="card hidden" id="hostsCard">
  <div class="head">
    <div>
      <div class="brand">내 PC</div>
      <div class="sub" id="accountLabel"></div>
    </div>
    <button class="link" id="signOut">로그아웃</button>
  </div>
  <div class="hosts" id="hostList"></div>
  <div class="msg" id="hostsMsg"></div>
  <div class="row">
    <button class="link" id="refresh">새로 고침</button>
    <button class="link" id="openSettings">화질 설정</button>
    <button class="link" id="openLog">로그 폴더</button>
  </div>
</div>

<div class="card hidden" id="settingsCard">
  <div class="head">
    <div>
      <div class="brand">화질 설정</div>
      <div class="sub">다음 연결부터 적용됩니다.</div>
    </div>
    <button class="link" id="closeSettings">뒤로</button>
  </div>

  <label for="bitrate">최대 화질 <span class="hint" id="bitrateLabel"></span></label>
  <input id="bitrate" type="range" min="2000" max="30000" step="1000">
  <div class="note">
    유선이나 집 Wi‑Fi에서는 높게 두어도 됩니다.
    <strong>중계 연결일 때만</strong> 이 값이 곧 데이터 사용량입니다.
  </div>

  <label for="fps">초당 프레임 <span class="hint" id="fpsLabel"></span></label>
  <input id="fps" type="range" min="15" max="60" step="15">
  <div class="note">움직임이 많은 화면일수록 높은 값이 도움이 됩니다.</div>

  <label for="monitor">기본 모니터</label>
  <select id="monitor">
    <option value="0">주 모니터</option>
    <option value="1">모니터 2</option>
    <option value="2">모니터 3</option>
    <option value="3">모니터 4</option>
  </select>
  <div class="note">모니터가 한 대뿐이면 이 설정은 무시됩니다.</div>

  <button id="saveSettings">저장</button>
  <div class="msg" id="settingsMsg"></div>
</div>

<script>
  const send = (payload) => window.chrome.webview.postMessage(JSON.stringify(payload));
  const $ = (id) => document.getElementById(id);
  const show = (el, visible) => el.classList.toggle('hidden', !visible);

  let busy = false;
  function setBusy(on, text) {
    busy = on;
    // Whatever ended the wait -- connected, failed, signed out -- the card stops claiming it.
    // The mark disappearing is how "back to normal" is observed.
    if (!on && connectingId) {
      connectingId = '';
      if (lastHosts.length) renderHosts(lastHosts);
    }
    $('signIn').disabled = on;
    $('signIn').innerHTML = on ? '<span class="spinner"></span>' + (text || '연결 중') : '로그인';
    document.querySelectorAll('.host').forEach((b) => { b.disabled = on || b.dataset.online !== '1'; });
  }
  function message(el, text, isError) {
    el.textContent = text || '';
    el.classList.toggle('error', !!isError);
  }

  $('signIn').onclick = () => {
    if (busy) return;
    const server = $('server').value.trim();
    const id = $('account').value.trim();
    const pw = $('password').value;
    if (!server || !id || !pw) {
      message($('signInMsg'), '서버 주소, 아이디, 비밀번호를 모두 입력해 주세요.', true);
      return;
    }
    message($('signInMsg'), '');
    setBusy(true, '로그인 중');
    send({ type: 'login', server, accountId: id, password: pw });
  };

  // Enter anywhere in the form submits, because a login screen that ignores Enter feels broken.
  ['server', 'account', 'password'].forEach((id) => {
    $(id).addEventListener('keydown', (e) => { if (e.key === 'Enter') $('signIn').click(); });
  });

  $('signOut').onclick = () => send({ type: 'logout' });
  $('refresh').onclick = () => { message($('hostsMsg'), '새로 고침 중'); send({ type: 'hosts' }); };
  $('openLog').onclick = () => send({ type: 'openlog' });

  // Settings
  const labelBitrate = () => { $('bitrateLabel').textContent = ($('bitrate').value / 1000) + ' Mbps'; };
  const labelFps = () => { $('fpsLabel').textContent = $('fps').value + ' fps'; };
  $('bitrate').oninput = labelBitrate;
  $('fps').oninput = labelFps;
  // Labelled from the start, not only once `restore` arrives. Opening settings before that
  // message lands showed two sliders with no numbers beside them -- which is what the preview
  // photographed, and it would be what a user saw if the restore were ever slow or absent.
  labelBitrate();
  labelFps();

  $('openSettings').onclick = () => { show($('hostsCard'), false); show($('settingsCard'), true); };
  $('closeSettings').onclick = () => { show($('settingsCard'), false); show($('hostsCard'), true); };
  $('saveSettings').onclick = () => {
    send({
      type: 'settings',
      bitrateKbps: parseInt($('bitrate').value, 10),
      fps: parseInt($('fps').value, 10),
      monitorId: parseInt($('monitor').value, 10),
    });
    message($('settingsMsg'), '저장했습니다.');
  };

  // Remembered so the list can be redrawn when only the connecting target changes.
  let lastHosts = [];
  let connectingId = '';

  function renderHosts(hosts) {
    lastHosts = hosts;
    const list = $('hostList');
    list.innerHTML = '';
    if (!hosts.length) {
      list.innerHTML = '<div class="empty">등록된 PC가 없습니다.<br>PC에서 GNLink 호스트를 실행해 주세요.</div>';
      return;
    }
    for (const host of hosts) {
      const button = document.createElement('button');
      const connecting = host.hostId === connectingId;
      button.className = 'host';
      button.dataset.online = host.online ? '1' : '0';
      if (connecting) button.dataset.connecting = '1';
      button.disabled = !host.online || busy;
      const state = connecting ? '연결하는 중…' : (host.online ? '연결 가능' : '오프라인');
      button.innerHTML =
        (connecting ? '<span class="spinner"></span>'
                    : '<span class="dot' + (host.online ? ' on' : '') + '"></span>') +
        '<span><span class="name"></span><div class="state">' + state + '</div></span>';
      // textContent, not innerHTML: the name came off another machine.
      button.querySelector('.name').textContent = host.hostName || host.hostId;
      button.onclick = () => {
        if (busy) return;
        connectingId = host.hostId;
        setBusy(true);
        message($('hostsMsg'), (host.hostName || 'PC') + '에 연결하는 중');
        renderHosts(lastHosts);
        send({ type: 'connect', hostId: host.hostId, hostName: host.hostName });
      };
      list.appendChild(button);
    }
  }

  // Everything the C++ side pushes arrives here.
  // PostWebMessageAsJson delivers an object that has already been parsed, while
  // PostWebMessageAsString delivers text. Accepting either is the difference between a screen
  // that works and one that silently ignores everything the client tells it.
  function readMessage(data) {
    if (typeof data === 'string') {
      try { return JSON.parse(data); } catch { return null; }
    }
    return data && typeof data === 'object' ? data : null;
  }

  // Cleared on sign-out, so an offer found for one account is never left standing for the next.
  let updateVersion = '';

  // The bar is position:fixed, so it sits over the page rather than in it. A fixed offset would
  // be wrong at every width except the one it was measured at: at 360px the text wraps to four
  // lines and covered the GNLink wordmark entirely. The page is pushed down by whatever the bar
  // actually measures, after it has been laid out.
  const showUpdateBar = (on) => {
    const bar = $('updateBar');
    show(bar, on);
    requestAnimationFrame(() => {
      document.body.style.paddingTop = on ? bar.offsetHeight + 'px' : '';
    });
  };

  $('updateNow').onclick = () => {
    if (!updateVersion) return;
    // Disabled here as well as by the native side. This stops the ordinary double click; the
    // native flag stops the two messages that were already in flight when it happened.
    $('updateNow').disabled = true;
    send({ type: 'update' });
  };
  // A deferral and nothing else: it takes the bar down for this run and does not touch signing
  // in, the host list, or whether the next check offers it again.
  $('updateLater').onclick = () => showUpdateBar(false);

  window.chrome.webview.addEventListener('message', (event) => {
    const msg = readMessage(event.data);
    if (!msg) return;

    if (msg.type === 'restore') {
      $('server').value = msg.server || '';
      $('account').value = msg.accountId || '';
      $('bitrate').value = msg.bitrateKbps || 12000;
      $('fps').value = msg.fps || 60;
      $('monitor').value = String(msg.monitorId || 0);
      labelBitrate();
      labelFps();
      if (msg.server && msg.accountId) $('password').focus();
      return;
    }
    if (msg.type === 'hosts') {
      setBusy(false);
      show($('signInCard'), false);
      show($('hostsCard'), true);
      $('accountLabel').textContent = msg.accountId || '';
      message($('hostsMsg'), '');
      renderHosts(msg.hosts || []);
      return;
    }
    if (msg.type === 'signedOut') {
      setBusy(false);
      updateVersion = '';
      showUpdateBar(false);
      show($('hostsCard'), false);
      show($('signInCard'), true);
      $('password').value = '';
      message($('signInMsg'), '');
      return;
    }
    if (msg.type === 'updateAvailable') {
      updateVersion = msg.version || '';
      $('updateText').textContent = msg.text || ('새 버전 ' + updateVersion + ' 이 있습니다.');
      $('updateNow').disabled = false;
      showUpdateBar(true);
      return;
    }
    if (msg.type === 'updateCleared') {
      updateVersion = '';
      $('updateNow').disabled = false;
      showUpdateBar(false);
      return;
    }
    if (msg.type === 'updateBusy') {
      // Re-enabled when the attempt ends, whichever way it ended. A button that stays dead after
      // a failure leaves the user with a notice and no way to act on it -- which is the state
      // this whole change exists to remove.
      $('updateNow').disabled = !!msg.busy;
      $('updateNow').textContent = msg.busy ? '준비 중…' : '업데이트';
      return;
    }
    if (msg.type === 'status') {
      const failed = msg.state === 'error';
      if (failed || msg.state === 'idle') setBusy(false);
      if (!$('settingsCard').classList.contains('hidden')) {
        message($('settingsMsg'), msg.detail, msg.state === 'error');
        return;
      }
      const target = $('hostsCard').classList.contains('hidden') ? $('signInMsg') : $('hostsMsg');
      message(target, msg.detail, failed);
    }
  });

  // A window that is resized while the offer is up rewraps the bar; the offset has to follow.
  window.addEventListener('resize', () => {
    const bar = $('updateBar');
    if (!bar.classList.contains('hidden')) {
      document.body.style.paddingTop = bar.offsetHeight + 'px';
    }
  });

  send({ type: 'ready' });
</script>
</body>
</html>
