<!doctype html>
<!--
  The macro window.

  Sits beside the video rather than over it, because unlike a phone the desktop has room for
  both: recording stays visible and stop is always one click away. The engine is C++ and does
  the timing; this only shows what was captured and asks for changes.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>매크로</title>
<style>
  :root {
    --bg: #0f1319; --panel: #171c25; --line: #262e3b; --text: #e8eaed; --muted: #98a1b0;
    --accent: #3b82f6; --accent-hover: #2f6fd0; --rec: #f2555a; --play: #3ecf8e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-size: 13px;
    font-family: 'Segoe UI', 'Malgun Gothic', sans-serif;
    display: flex; flex-direction: column; padding: 14px; gap: 12px;
    -webkit-user-select: none; user-select: none;
  }

  .status {
    display: flex; align-items: center; gap: 9px;
    padding: 11px 13px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 9px; font-size: 13.5px;
  }
  .badge { width: 9px; height: 9px; border-radius: 50%; background: #4b5563; flex: none; }
  .badge.rec { background: var(--rec); animation: pulse 1.1s ease-in-out infinite; }
  .badge.play { background: var(--play); }
  @keyframes pulse { 50% { opacity: .3; } }
  .status .count { margin-left: auto; color: var(--muted); font-size: 12px; }

  .bar { display: flex; gap: 7px; }
  button {
    flex: 1; padding: 9px 0; font-size: 13px; font-family: inherit; color: var(--text);
    background: #0d1117; border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #1e2531; border-color: #33404f; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent-hover); }
  button.danger:hover:not(:disabled) { border-color: var(--rec); color: #ffb4b6; }

  .steps {
    flex: 1; min-height: 120px; overflow-y: auto; background: #0d1117;
    border: 1px solid var(--line); border-radius: 9px; padding: 5px;
  }
  .step {
    display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 6px;
    cursor: pointer; font-variant-numeric: tabular-nums;
  }
  .step:hover { background: #161d27; }
  .step.sel { background: #1b2735; outline: 1px solid var(--accent); }
  .step.now { background: #12291f; }
  .step .idx { color: var(--muted); font-size: 11.5px; width: 26px; flex: none; }
  .step .kind { width: 58px; flex: none; color: #b9c2d0; }
  .step .pos { color: var(--muted); }
  .step .gap { margin-left: auto; color: var(--muted); font-size: 11.5px; }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; line-height: 1.6; }

  fieldset { border: 1px solid var(--line); border-radius: 9px; margin: 0; padding: 11px 13px 13px; }
  legend { color: var(--muted); font-size: 11.5px; padding: 0 5px; }
  .grid { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px 10px; align-items: center; }
  .grid label { color: var(--muted); font-size: 12px; white-space: nowrap; }
  input, select {
    width: 100%; padding: 6px 8px; font-size: 12.5px; font-family: inherit; color: var(--text);
    background: #0d1117; border: 1px solid var(--line); border-radius: 6px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .notice { font-size: 12px; color: var(--muted); min-height: 16px; }
  .notice.error { color: #ff9ea1; }
  .hint { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>

<div class="status">
  <span class="badge" id="badge"></span>
  <span id="statusText">준비됨</span>
  <span class="count" id="countText"></span>
</div>

<div class="bar">
  <button id="record" class="primary">녹화</button>
  <button id="pause" disabled>일시정지</button>
  <button id="play">재생</button>
  <button id="clear" class="danger">지우기</button>
</div>

<div class="steps" id="steps"></div>

<fieldset>
  <legend>선택한 동작</legend>
  <div class="grid">
    <label for="editX">X</label><input id="editX" type="number">
    <label for="editY">Y</label><input id="editY" type="number">
    <label for="editDelay">간격(ms)</label><input id="editDelay" type="number" min="0">
    <button id="applyEdit">수정</button>
    <button id="deleteStep" class="danger">삭제</button>
  </div>
</fieldset>

<fieldset>
  <legend>재생 방식</legend>
  <div class="grid">
    <label for="repeat">반복</label><input id="repeat" type="number" min="0" value="1">
    <label for="jitterMs">시간 흔들기</label><input id="jitterMs" type="number" min="0" value="0">
    <label for="jitterPx">위치 흔들기</label><input id="jitterPx" type="number" min="0" value="0">
    <label for="gapMin">반복 간격</label>
    <div style="display:flex;gap:6px;align-items:center">
      <input id="gapMin" type="number" min="0" value="0">
      <span style="color:var(--muted)">~</span>
      <input id="gapMax" type="number" min="0" value="0">
    </div>
  </div>
  <div class="hint">
    반복에 0을 넣으면 멈출 때까지 계속합니다.
    흔들기는 매번 조금씩 다르게 재생해 기계적인 반복을 피합니다.
  </div>
</fieldset>

<fieldset>
  <legend>저장된 매크로</legend>
  <div class="grid" style="grid-template-columns: 1fr auto auto auto">
    <select id="saved"></select>
    <button id="load">불러오기</button>
    <button id="delete" class="danger">삭제</button>
    <span></span>
    <input id="saveName" placeholder="이름" style="grid-column: 1">
    <button id="save" class="primary" style="grid-column: 2 / span 3">저장</button>
  </div>
</fieldset>

<div class="notice" id="notice"></div>

<script>
  const send = (p) => window.chrome.webview.postMessage(JSON.stringify(p));
  const $ = (id) => document.getElementById(id);
  const num = (id) => Math.max(0, parseInt($(id).value, 10) || 0);

  let selected = -1;
  let current = { state: 'idle', paused: false, steps: [] };

  $('record').onclick = () => send({ type: current.state === 'recording' ? 'stop' : 'record' });
  $('play').onclick = () => {
    if (current.state === 'playing') { send({ type: 'stop' }); return; }
    send({
      type: 'play',
      repeatCount: num('repeat'),
      timingJitterMs: num('jitterMs'),
      positionJitterPx: num('jitterPx'),
      repeatGapMinMs: num('gapMin'),
      repeatGapMaxMs: num('gapMax'),
    });
  };
  $('pause').onclick = () => send({ type: 'pause' });
  $('clear').onclick = () => { selected = -1; send({ type: 'clear' }); };

  $('applyEdit').onclick = () => {
    if (selected < 0) return;
    send({
      type: 'editStep', index: selected,
      x: num('editX'), y: num('editY'), delayMs: num('editDelay'),
    });
  };
  $('deleteStep').onclick = () => {
    if (selected < 0) return;
    send({ type: 'deleteStep', index: selected });
    selected = -1;
  };

  $('save').onclick = () => send({ type: 'save', name: $('saveName').value.trim() });
  $('load').onclick = () => { if ($('saved').value) send({ type: 'load', name: $('saved').value }); };
  $('delete').onclick = () => { if ($('saved').value) send({ type: 'delete', name: $('saved').value }); };

  function renderSteps() {
    const list = $('steps');
    if (!current.steps.length) {
      list.innerHTML = '<div class="empty">녹화된 동작이 없습니다.<br>녹화를 누르고 원격 화면을 조작해 보세요.</div>';
      return;
    }
    // Rebuilt only when something changed, so the list does not fight the user's scroll.
    list.innerHTML = '';
    current.steps.forEach((step, i) => {
      const row = document.createElement('div');
      row.className = 'step' +
        (i === selected ? ' sel' : '') +
        (current.state === 'playing' && i === current.playbackPosition - 1 ? ' now' : '');
      row.innerHTML =
        '<span class="idx">' + (i + 1) + '</span>' +
        '<span class="kind"></span>' +
        '<span class="pos"></span>' +
        '<span class="gap"></span>';
      row.querySelector('.kind').textContent = step.kind;
      row.querySelector('.pos').textContent = step.x + ', ' + step.y;
      row.querySelector('.gap').textContent = step.delayMs ? '+' + step.delayMs + 'ms' : '';
      row.onclick = () => {
        selected = i;
        $('editX').value = step.x;
        $('editY').value = step.y;
        $('editDelay').value = step.delayMs;
        renderSteps();
      };
      list.appendChild(row);
    });
  }

  function renderState(msg) {
    current = msg;
    if (selected >= msg.steps.length) selected = -1;

    const recording = msg.state === 'recording';
    const playing = msg.state === 'playing';
    $('badge').className = 'badge' + (recording ? ' rec' : playing ? ' play' : '');
    $('statusText').textContent =
      recording ? (msg.paused ? '녹화 일시정지됨' : '녹화 중')
      : playing ? (msg.paused ? '재생 일시정지됨' : '재생 중')
      : '준비됨';
    $('countText').textContent =
      playing ? (msg.playbackPosition + ' / ' + msg.stepCount + ' · ' + msg.completedRepeats + '회 완료')
              : (msg.stepCount + '개 동작');

    $('record').textContent = recording ? '녹화 중지' : '녹화';
    $('play').textContent = playing ? '재생 중지' : '재생';
    $('play').disabled = recording || (!playing && msg.stepCount === 0);
    $('pause').textContent = msg.paused ? '재개' : '일시정지';
    $('pause').disabled = msg.state === 'idle';
    $('clear').disabled = recording || playing || msg.stepCount === 0;
    $('record').className = recording ? 'danger' : 'primary';

    const saved = $('saved');
    const previous = saved.value;
    saved.innerHTML = '';
    for (const name of msg.saved || []) {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      saved.appendChild(option);
    }
    if (previous) saved.value = previous;
    $('load').disabled = !(msg.saved || []).length;
    $('delete').disabled = !(msg.saved || []).length;

    renderSteps();
  }

  // PostWebMessageAsJson delivers an object already parsed; PostWebMessageAsString delivers
  // text. Accepting either is what keeps this window from ignoring everything sent to it.
  function readMessage(data) {
    if (typeof data === 'string') {
      try { return JSON.parse(data); } catch { return null; }
    }
    return data && typeof data === 'object' ? data : null;
  }

  window.chrome.webview.addEventListener('message', (event) => {
    const msg = readMessage(event.data);
    if (!msg) return;
    if (msg.type === 'state') { renderState(msg); return; }
    if (msg.type === 'notice') {
      $('notice').textContent = msg.detail || '';
      $('notice').classList.toggle('error', !!msg.error);
    }
  });

  send({ type: 'ready' });
</script>
</body>
</html>
